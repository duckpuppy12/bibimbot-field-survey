<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-label="쑥부쟁이 특징 도식">
  <title>쑥부쟁이 — 연한 자주빛 큰 꽃이 적게 달린다</title>
  <rect width="200" height="170" fill="#f7faf8"/>
