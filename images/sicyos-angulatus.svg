<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-label="가시박 특징 도식">
  <title>가시박 — 오각형 큰 잎, 가시 뭉치 열매, 덩굴손</title>
  <rect width="200" height="170" fill="#f7faf8"/>
  <!-- 덩굴 줄기 -->
  <path d="M18 150 C50 130 44 100 72 88 C96 78 108 60 140 54" fill="none" stroke="#4a7a52" stroke-width="3"/>
  <!-- 덩굴손 -->
  <path d="M140 54 c10 -6 14 4 6 8 c-8 4 -4 -14 10 -10" fill="none" stroke="#4a7a52" stroke-width="2"/>
  <!-- 오각형에 가까운 잎 -->
  <path d="M70 86 L44 60 L56 28 L94 20 L118 44 L104 76 Z" fill="#9ec9a4" stroke="#2f6137" stroke-width="2.5"/>
  <path d="M86 50 L70 86 M86 50 L56 28 M86 50 L94 20 M86 50 L118 44 M86 50 L104 76" stroke="#2f6137" stroke-width="1.2" fill="none"/>
  <!-- 가시 뭉치 열매 -->
  <g stroke="#7a5a2a" stroke-width="1.6">
    <circle cx="150" cy="118" r="13" fill="#cdbb95"/>
    <path d="M150 105 v-8 M163 118 h8 M150 131 v8 M137 118 h-8 M159 109 l6 -6 M159 127 l6 6 M141 127 l-6 6 M141 109 l-6 -6"/>
  </g>
  <text x="100" y="162" text-anchor="middle" font-size="11" fill="#33413a" font-family="sans-serif">잎은 오각형, 열매는 가시 뭉치</text>
</svg>
